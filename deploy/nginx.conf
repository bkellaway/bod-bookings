# /etc/nginx/sites-available/book.backofficedesigns.com
server {
    listen 80;
    server_name book.backofficedesigns.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name book.backofficedesigns.com;

    ssl_certificate     /etc/letsencrypt/live/book.backofficedesigns.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/book.backofficedesigns.com/privkey.pem;

    root /var/www/bookings/public;
    index index.php;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /assets/ { expires 7d; access_log off; }

    location / { try_files $uri /index.php$is_args$args; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;   # front controller only
    }
    location ~ /\. { deny all; }
}
