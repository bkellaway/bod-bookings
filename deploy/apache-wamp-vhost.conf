# WAMP local dev: add to C:\wamp64\bin\apache\apache2.x\conf\extra\httpd-vhosts.conf, then add
# "127.0.0.1 book.local" to C:\Windows\System32\drivers\etc\hosts and restart Apache.
<VirtualHost *:80>
    ServerName book.local
    DocumentRoot "C:/wamp64/www/bookings/public"
    <Directory "C:/wamp64/www/bookings/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require local
    </Directory>
</VirtualHost>
